name: Deploy DLC Protect to Supabase
description: One-click deploy of DLC Protect Edge Function to your Supabase project
author: DLC Protect

inputs:
  supabase-url:
    description: Supabase project URL
    required: true
  supabase-service-role-key:
    description: Supabase service role key
    required: true
  jwt-secret:
    description: Secret for offline token signing
    required: true
    default: dlc-protect-saas-jwt
  mock-steam:
    description: Enable mock Steam mode (no real API key needed)
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    - name: Link project
      run: supabase link --project-ref ${{ inputs.supabase-url }}
      shell: bash

    - name: Push migrations
      run: supabase db push
      shell: bash

    - name: Set secrets
      run: |
        supabase secrets set JWT_SECRET=${{ inputs.jwt-secret }}
        supabase secrets set MOCK_STEAM=${{ inputs.mock-steam }}
      shell: bash

    - name: Deploy Edge Function
      run: supabase functions deploy verify-dlc --no-verify-jwt
      shell: bash

    - name: Health check
      run: |
        curl -sf ${{ inputs.supabase-url }}/functions/v1/verify-dlc/health
      shell: bash